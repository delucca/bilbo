name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a # 1.95.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # The nix job runs the tests at the real version.
      - name: Test at a bumped version
        run: |
          sed -i 's/^version = ".*"$/version = "99.99.99"/' Cargo.toml
          sed -i 's/"version": ".*"/"version": "99.99.99"/' plugins/bilbo/.codex-plugin/plugin.json
          cargo update --workspace
          cargo test --locked

  nix:
    name: nix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'Cargo.toml', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: ${{ github.ref == 'refs/heads/main' }}
          gc-max-store-size-linux: 0

      - name: Flake check
        run: nix flake check -L

      # The cache keeps only what this root holds after garbage collection.
      - name: Root the dependencies
        if: github.ref == 'refs/heads/main'
        run: nix build --out-link deps .#bilbo.cargoArtifacts

      - name: Evaluate aarch64-darwin
        run: nix eval --raw .#packages.aarch64-darwin.default.drvPath

  evals:
    name: evals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-evals-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'Cargo.toml', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-evals-${{ runner.os }}-
          save: ${{ github.ref == 'refs/heads/main' }}
          gc-max-store-size-linux: 0

      - name: Build bilbo
        run: nix develop -c cargo build --locked

      - name: Install the harness
        run: nix develop -c uv --directory evals sync --locked

      - name: Test the harness
        run: BILBO_BIN="$PWD/target/debug/bilbo" nix develop -c uv --directory evals run pytest
