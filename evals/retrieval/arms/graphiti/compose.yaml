services:
  neo4j:
    image: neo4j:5.26.30-community@sha256:3388e05ee53c8313d01acdf33e63ad175af95a92226dc8551160564439ce2c8c
    user: ${BILBO_UID}:${BILBO_GID}
    environment:
      NEO4J_AUTH: neo4j/bilbo-eval  # no port is published
      NEO4J_server_memory_heap_initial__size: 2G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_dbms_usage__report_enabled: "false"
      NEO4J_server_directories_data: /work/neo4j/data  # inside /work, so Neo4j creates them as this user: on Linux the daemon would create a missing bind-mount path as root
      NEO4J_server_directories_logs: /work/neo4j/logs
    stop_grace_period: 2m  # Compose's 10 s default would kill a JVM that is shutting down, and the dump needs a clean store
    volumes:
      - ${BILBO_EVAL_WORK}:/work
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "bilbo-eval", "RETURN 1"]
      interval: 2s
      retries: 60

  embedder:
    image: ghcr.io/ggml-org/llama.cpp:server-b11206@sha256:00bd6c289c590e576948cb3639b8195e4d3e6dd6ba1d761f0e2b871fcd4df24f
    environment:
      LLAMA_ARG_MODEL: /models/embedder.gguf
      LLAMA_ARG_EMBEDDINGS: "1"
      LLAMA_ARG_POOLING: last
      LLAMA_ARG_CTX_SIZE: "8192"
      LLAMA_ARG_BATCH: "8192"
      LLAMA_ARG_UBATCH: "8192"
      LLAMA_ARG_N_PARALLEL: "1"
      LLAMA_ARG_FLASH_ATTN: "on"
      LLAMA_ARG_CACHE_RAM: "0"  # no prompt cache in host memory, which takes up to 8 GiB by default
    volumes:
      - ${BILBO_EVAL_EMBEDDER}:/models/embedder.gguf:ro
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 2s
      retries: 300

  build:
    build: .
    profiles: [build]
    user: ${BILBO_UID}:${BILBO_GID}
    depends_on:
      neo4j: { condition: service_healthy }
      embedder: { condition: service_healthy }
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: bilbo-eval
      EMBEDDER_URL: http://embedder:8080/v1
      BILBO_EVAL_LLM_URL: ${BILBO_EVAL_LLM_URL}
      BILBO_EVAL_LLM_KEY: ${BILBO_EVAL_LLM_KEY}
      BILBO_EVAL_LLM_MODEL: ${BILBO_EVAL_LLM_MODEL}
      BILBO_EVAL_LLM_SMALL_MODEL: ${BILBO_EVAL_LLM_SMALL_MODEL:-}
      BILBO_EVAL_LLM_HEADERS: ${BILBO_EVAL_LLM_HEADERS:-}
      BILBO_EVAL_SESSIONS: ${BILBO_EVAL_SESSIONS}
      BILBO_EVAL_DEVICE: ${BILBO_EVAL_DEVICE}
    volumes:
      - ${BILBO_EVAL_CORPUS}:/corpus:ro
      - ${BILBO_EVAL_WORK}:/work

  pack:  # the store: a dump of the database, which build-store.sh runs once neo4j has stopped
    image: neo4j:5.26.30-community@sha256:3388e05ee53c8313d01acdf33e63ad175af95a92226dc8551160564439ce2c8c
    profiles: [pack]
    user: ${BILBO_UID}:${BILBO_GID}
    entrypoint: ["neo4j-admin", "database", "dump", "neo4j", "--to-path=/dumps", "--overwrite-destination"]
    volumes:
      - ${BILBO_EVAL_WORK}/neo4j/data:/data
      - ${BILBO_EVAL_WORK}/store:/dumps

  restore:  # the reverse of pack: build-store.sh --check loads the store's dump with it before neo4j starts
    image: neo4j:5.26.30-community@sha256:3388e05ee53c8313d01acdf33e63ad175af95a92226dc8551160564439ce2c8c
    profiles: [restore]
    user: ${BILBO_UID}:${BILBO_GID}
    environment:  # the image's entrypoint hands these to neo4j-admin, which creates the directories as this user
      NEO4J_server_directories_data: /work/neo4j/data
      NEO4J_server_directories_logs: /work/neo4j/logs
    command: ["neo4j-admin", "database", "load", "neo4j", "--from-path=/work/store"]
    volumes:
      - ${BILBO_EVAL_WORK}:/work
