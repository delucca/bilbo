[project]
name = "bilbo-evals"
version = "0.1.0"
description = "Retrieval evals for bilbo"
requires-python = "==3.12.*"
dependencies = [
    "ir-measures==0.4.3",
    "bm25s==0.3.11",
    "PyStemmer==3.1.0",
    "numpy==2.5.3",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[project.scripts]
bilbo-evals = "bilbo_evals.cli:main"

[build-system]
requires = ["uv_build==0.11.21"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
