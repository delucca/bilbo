[package]
name = "bilbo"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/delucca/bilbo"
publish = false

[dependencies]
cliclack = "0.5.6"
libc = "0.2.190"
jiff = "0.2.37"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.4.2", features = ["json"] }
zeroize = "1.9.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
