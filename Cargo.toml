[workspace]
resolver = "3"
members = ["apps/cli", "libs/rust/core"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
runfiles = "0.3.0"
rustix = { version = "1.1.5", default-features = false, features = ["std", "event", "fs", "pty"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Hand-picked pedantic subset, all at warn; checks run with -D warnings.
cloned_instead_of_copied = "warn"
doc_markdown = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
if_not_else = "warn"
implicit_clone = "warn"
items_after_statements = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"
wildcard_imports = "warn"
# Restriction lints.
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
