[package]
name = "bilbo"
version = "0.17.0"
edition = "2024"
rust-version = "1.95"
description = "Durable memory for coding agents: Markdown notes they write and recall, and a library of sources they cite"
license = "Apache-2.0"
repository = "https://github.com/delucca/bilbo"
homepage = "https://github.com/delucca/bilbo"
readme = "README.md"
keywords = ["agents", "memory", "notes", "search", "sync"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[dependencies]
cliclack = "0.5.6"
libc = "0.2.190"
notify = "8.2.0"
ring = "0.17.14"
sha2 = { version = "0.11.0", features = ["zeroize"] }
jiff = "0.2.37"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Upstream commit that retries reads interrupted by a signal; back to a crates.io version once ureq releases it.
ureq = { git = "https://github.com/algesten/ureq", rev = "0ebb046e1cf269592f9edb3a55f489d508f47a1d", features = ["json"] }
unicode-normalization = "0.1.25"
zeroize = "1.9.0"
htmd = "0.5.5"
markup5ever_rcdom = "0.38.0"
ed25519-dalek = "3.0.0"
hpke = { version = "0.14.1", default-features = false, features = ["x25519", "chacha", "alloc", "getrandom"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
hkdf = "0.13.0"
getrandom = "0.4.3"
base64 = "0.23.1"
spake2 = { version = "0.5.0-pre.0", default-features = false }
httparse = "1.10.1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
