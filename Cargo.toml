[workspace]
resolver = "3"
members = [
    "apps/cli",
    "libs/rust/kinds",
    "libs/rust/kinds/markdown",
    "libs/rust/kinds/session",
    "libs/rust/settings",
    "libs/rust/store",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
bilbo-kinds = { path = "libs/rust/kinds" }
bilbo-markdown = { path = "libs/rust/kinds/markdown" }
bilbo-session = { path = "libs/rust/kinds/session" }
bilbo-settings = { path = "libs/rust/settings" }
bilbo-store = { path = "libs/rust/store" }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
proc-macro2 = { version = "1.0.107", default-features = false }
runfiles = "0.3.0"
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
rustix = { version = "1.1.5", default-features = false, features = ["std", "event", "fs", "pty"] }
serde = { version = "1.0.229", default-features = false, features = ["std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
syn = { version = "3.0.9", default-features = false, features = ["full", "parsing", "visit"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "parse"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
zstd = { version = "0.14.3", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
self_named_module_files = "warn"
cloned_instead_of_copied = "warn"
doc_markdown = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
if_not_else = "warn"
implicit_clone = "warn"
items_after_statements = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"
wildcard_imports = "warn"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
