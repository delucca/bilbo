[package]
name = "bilbo"
version = "0.9.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/delucca/bilbo"
publish = false

[dependencies]
cliclack = "0.5.6"
libc = "0.2.190"
ring = "0.17.14"
sha2 = "0.11.0"
jiff = "0.2.37"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.4.2", features = ["json"] }
unicode-normalization = "0.1.25"
zeroize = "1.9.0"
htmd = "0.5.5"
markup5ever_rcdom = "0.38.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
