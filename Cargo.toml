[workspace]
resolver = "3"
members = [
    "apps/cli",
    "libs/entries/rust",
    "libs/language/rust",
    "libs/search/rust",
    "libs/settings/rust",
    "libs/store/rust",
    "tools/rust/layout",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
bilbo-entries = { path = "libs/entries/rust" }
bilbo-language = { path = "libs/language/rust" }
bilbo-layout = { path = "tools/rust/layout" }
bilbo-search = { path = "libs/search/rust" }
bilbo-settings = { path = "libs/settings/rust" }
bilbo-store = { path = "libs/store/rust" }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
frostem = { version = "2.20261016.2", default-features = false, features = ["english"] }
proc-macro2 = { version = "1.0.107", default-features = false }
runfiles = "0.3.0"
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
rustix = { version = "1.1.5", default-features = false, features = ["std", "event", "fs", "pty"] }
serde = { version = "1.0.229", default-features = false, features = ["std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
stop-words = { version = "0.10.1", default-features = false, features = ["nltk"] }
strsim = "0.11.1"
syn = { version = "3.0.9", default-features = false, features = ["full", "parsing", "visit"] }
tantivy = { version = "0.27.0", default-features = false, features = ["mmap"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "parse"] }
whichlang = "0.1.1"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
zstd = { version = "0.14.3", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
self_named_module_files = "warn"
cloned_instead_of_copied = "warn"
doc_markdown = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
if_not_else = "warn"
implicit_clone = "warn"
items_after_statements = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"
wildcard_imports = "warn"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
