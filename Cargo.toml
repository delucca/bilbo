[package]
name = "bilbo"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/delucca/bilbo"
publish = false

[dependencies]
jiff = "0.2.37"
serde = { version = "1.0.229", features = ["derive"] }
ureq = { version = "3.4.2", features = ["json"] }

[dev-dependencies]
serde_json = "1.0.151"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
